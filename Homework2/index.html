<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Coffee Interaction - Heart Pop Style</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #fceee9;
        color: #6b524d;
        font-family: "Courier New", Courier, monospace;
      }
      #canvas-container {
        border: 2px solid #8d7069;
        border-radius: 16px;
        overflow: hidden;
        background-color: #ffffff;
        box-shadow: 0 8px 24px rgba(141, 112, 105, 0.12);
      }
      .instructions {
        margin-top: 20px;
        text-align: center;
        color: #8c736c;
        font-size: 14px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="instructions">
      <b>[ Direct Interactions ]</b><br />
      • <b>Drink:</b> Click the cup continuously<br />
      • <b>Throw:</b> Drag the cup quickly to either side<br />
      • <b>Spill:</b> Hold click on the cup & Scroll mouse wheel<br />
      • <b>Pop Heart:</b> Click any floating heart! 💖
    </div>

    <script src="sketch.js"></script>
  </body>
</html>
